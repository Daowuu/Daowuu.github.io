<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="point_sampling 几何掩码与物理遮挡对比示意">
  <defs>
    <style>
      .f { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      .title { font-size: 16.5px; font-weight: 700; fill: #24211c; }
      .sub { font-size: 12.5px; font-weight: 700; fill: #24211c; }
      .lbl { font-size: 11.5px; fill: #4a443b; }
      .muted { font-size: 11px; fill: #7e776c; }
      .accent { font-size: 11.5px; font-weight: 700; fill: #6d28d9; }
      .warn { font-size: 11.5px; font-weight: 700; fill: #b45309; }
      .bad { font-size: 11.5px; font-weight: 700; fill: #b91c1c; }
      .good { font-size: 11.5px; font-weight: 700; fill: #15803d; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="100%" stop-color="#f7f4ec"/>
    </linearGradient>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#7e776c"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="912" height="392" rx="16" fill="url(#bg)" stroke="#e6dfd1" stroke-width="1.2"/>
  <text x="460" y="34" text-anchor="middle" class="f title">源码 point_sampling 掩码到底查了什么？（几何落框 ✓ ≠ 物理无遮挡）</text>

  <!-- 主视锥画布 -->
  <rect x="24" y="52" width="872" height="248" rx="12" fill="#ffffff" stroke="#e8e2d6" stroke-width="1"/>

  <!-- 相机视锥扇形填充（从 (148, 178) 向右展开） -->
  <polygon points="148,178 860,72 860,284" fill="#faf5ff" fill-opacity="0.72"/>
  <line x1="148" y1="178" x2="860" y2="72" stroke="#d8b4fe" stroke-width="1.3" stroke-dasharray="5 3"/>
  <line x1="148" y1="178" x2="860" y2="284" stroke="#d8b4fe" stroke-width="1.3" stroke-dasharray="5 3"/>

  <!-- 相机后方盲区标注 -->
  <rect x="38" y="138" width="82" height="80" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-dasharray="4 3"/>
  <circle cx="79" cy="170" r="5.5" fill="#dc2626"/>
  <text x="79" y="191" text-anchor="middle" class="f bad" font-size="10.5">相机后方</text>
  <text x="79" y="206" text-anchor="middle" class="mono" font-size="9.5" fill="#b91c1c">Z_ref ≤ 0</text>
  <text x="79" y="128" text-anchor="middle" class="f bad" font-size="10.5">✗ 掩码拦截</text>

  <!-- 视锥外点（上方出框） -->
  <circle cx="520" cy="84" r="5.5" fill="#dc2626"/>
  <line x1="148" y1="178" x2="514" y2="85" stroke="#fca5a5" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="536" y="66" width="166" height="32" rx="7" fill="#fef2f2" stroke="#fecaca"/>
  <text x="619" y="81" text-anchor="middle" class="f bad" font-size="10.5">✗ 落出画框外：u,v ∉ (0,1)</text>
  <text x="619" y="93" text-anchor="middle" class="f muted" font-size="9.8">point_sampling 直接过滤</text>

  <!-- 相机本体图标 -->
  <polygon points="130,164 152,172 152,184 130,192" fill="#24211c"/>
  <rect x="116" y="168" width="16" height="20" rx="3" fill="#24211c"/>
  <text x="134" y="210" text-anchor="middle" class="f sub" font-size="11.5">自车相机</text>

  <!-- 像平面画框（x=282） -->
  <line x1="282" y1="126" x2="282" y2="230" stroke="#6d28d9" stroke-width="3.2" stroke-linecap="round"/>
  <rect x="282" y="132" width="14" height="92" fill="#ede9fe" fill-opacity="0.7"/>
  <text x="284" y="114" text-anchor="middle" class="f accent">像平面 (0, 1)</text>

  <!-- 同一条主视线：从相机穿过像平面 → 撞上前车 → 虚线穿透至后车参考点 -->
  <line x1="152" y1="178" x2="492" y2="178" stroke="#ec4899" stroke-width="2.6"/>
  <line x1="568" y1="178" x2="744" y2="178" stroke="#ec4899" stroke-width="2.2" stroke-dasharray="6 4"/>

  <!-- 像平面上的落点 -->
  <circle cx="282" cy="178" r="5.5" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
  <rect x="218" y="238" width="128" height="24" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="282" y="254" text-anchor="middle" class="f good" font-size="10.5">✓ 投影在画框内</text>

  <!-- 近处前车（物理遮挡物） -->
  <g transform="translate(492, 134)">
    <rect x="0" y="0" width="76" height="88" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="38" y="34" text-anchor="middle" class="f warn" font-size="12">近处前车</text>
    <text x="38" y="52" text-anchor="middle" class="f" font-size="10.5" fill="#92400e">（实际被拍到）</text>
    <text x="38" y="72" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#b45309">Z_pix = 12m</text>
  </g>
  <circle cx="492" cy="178" r="5.5" fill="#d97706" stroke="#fff" stroke-width="2"/>

  <!-- 远处被挡住的 3D 参考点（后车位置） -->
  <g transform="translate(744, 138)">
    <rect x="0" y="0" width="106" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="53" y="26" text-anchor="middle" class="f accent">远处参考点</text>
    <text x="53" y="44" text-anchor="middle" class="f muted" font-size="10">（已被前车挡住）</text>
    <text x="53" y="64" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#6b21d6">Z_ref = 28m</text>
  </g>
  <circle cx="744" cy="178" r="5.5" fill="#7c3aed" stroke="#fff" stroke-width="2"/>

  <!-- 深度比较标注 -->
  <line x1="530" y1="242" x2="744" y2="242" stroke="#7e776c" stroke-width="1.3" marker-end="url(#arr-gray)"/>
  <rect x="570" y="229" width="136" height="24" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="638" y="245" text-anchor="middle" class="f warn" font-size="10.5">Z_ref (28m) &gt; Z_pix (12m)</text>
  <text x="638" y="268" text-anchor="middle" class="f muted" font-size="10">视线早已被前车截断，但掩码不知道</text>

  <!-- 底部两张结论对比卡 -->
  <rect x="24" y="314" width="424" height="68" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="40" y="336" class="f accent">point_sampling 源码实际检查（仅 2 条）</text>
  <text x="40" y="355" class="f lbl">1. 投影深度 Z_ref &gt; 1e-5（在相机前方，没在身后）</text>
  <text x="40" y="372" class="f lbl">2. 归一化像素坐标 u, v ∈ (0, 1)（没落出照片边界）</text>

  <rect x="464" y="314" width="432" height="68" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="480" y="336" class="f warn">工程防踩坑提醒（遮挡怎么处理？）</text>
  <text x="480" y="355" class="f lbl">• 被挡参考点仍通过掩码并采回前车特征，靠注意力权重降权。</text>
  <text x="480" y="372" class="f lbl">• 判遮挡须在同一相机深度轴比 Z_pix 与 Z_ref（勿比高度 z'）。</text>
</svg>
