<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="传统全局注意力与 BEVFormer 可变形局部采样对比">
  <defs>
    <style>
      .f { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      .title { font-size: 16.5px; font-weight: 700; fill: #24211c; }
      .sub { font-size: 13px; font-weight: 700; fill: #24211c; }
      .lbl { font-size: 11.5px; fill: #4a443b; }
      .muted { font-size: 11px; fill: #7e776c; }
      .accent { font-size: 11.5px; font-weight: 700; fill: #6d28d9; }
      .pink { font-size: 11.5px; font-weight: 700; fill: #be185d; }
      .bad { font-size: 11.5px; font-weight: 700; fill: #b91c1c; }
      .good { font-size: 11.5px; font-weight: 700; fill: #15803d; }

      @keyframes offsetPulse {
        0%, 100% { opacity: 0.95; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.12); }
      }
      .ring-pulse { transform-origin: 730px 194px; animation: offsetPulse 3s ease-in-out infinite; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="100%" stop-color="#f7f4ec"/>
    </linearGradient>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#ec4899"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="912" height="392" rx="16" fill="url(#bg)" stroke="#e6dfd1" stroke-width="1.2"/>
  <text x="460" y="34" text-anchor="middle" class="f title">为什么 BEVFormer 用“可变形局部采样”而不是全局注意力？</text>

  <!-- ==================== 左栏：传统全局注意力（算力爆炸） ==================== -->
  <rect x="24" y="54" width="420" height="292" rx="12" fill="#ffffff" stroke="#e8e2d6" stroke-width="1"/>
  <rect x="38" y="68" width="142" height="22" rx="11" fill="#fef2f2" stroke="#fecaca"/>
  <text x="109" y="83" text-anchor="middle" class="f bad">✗ 传统全局注意力</text>
  <text x="190" y="83" class="f muted">1 格要扫描全部相机所有像素</text>

  <!-- 左侧单个 BEV 格 -->
  <rect x="48" y="168" width="52" height="52" rx="7" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="74" y="192" text-anchor="middle" class="f accent">BEV 格</text>
  <text x="74" y="208" text-anchor="middle" class="mono" font-size="10.5" fill="#6b21d6">Qₚ</text>

  <!-- 密集交叉连线（表现全图两两计算） -->
  <g stroke="#fca5a5" stroke-width="1" opacity="0.72">
    <line x1="100" y1="184" x2="210" y2="122"/>
    <line x1="100" y1="186" x2="210" y2="146"/>
    <line x1="100" y1="188" x2="210" y2="170"/>
    <line x1="100" y1="192" x2="210" y2="194"/>
    <line x1="100" y1="196" x2="210" y2="218"/>
    <line x1="100" y1="200" x2="210" y2="242"/>
    <line x1="100" y1="204" x2="210" y2="266"/>
    <line x1="100" y1="188" x2="275" y2="122"/>
    <line x1="100" y1="194" x2="275" y2="194"/>
    <line x1="100" y1="200" x2="275" y2="266"/>
    <line x1="100" y1="192" x2="340" y2="146"/>
    <line x1="100" y1="198" x2="340" y2="242"/>
  </g>

  <!-- 6 张相机全量特征像素网格 -->
  <g transform="translate(206, 112)">
    <rect x="0" y="0" width="212" height="164" rx="8" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.3"/>
    <!-- 像素格子阵列 -->
    <g stroke="#fecaca" stroke-width="0.9">
      <line x1="35" y1="0" x2="35" y2="164"/>
      <line x1="70" y1="0" x2="70" y2="164"/>
      <line x1="105" y1="0" x2="105" y2="164"/>
      <line x1="140" y1="0" x2="140" y2="164"/>
      <line x1="175" y1="0" x2="175" y2="164"/>
      <line x1="0" y1="33" x2="212" y2="33"/>
      <line x1="0" y1="66" x2="212" y2="66"/>
      <line x1="0" y1="99" x2="212" y2="99"/>
      <line x1="0" y1="132" x2="212" y2="132"/>
    </g>
    <!-- 所有像素点都参与计算 -->
    <rect x="18" y="64" width="176" height="36" rx="7" fill="#ffffff" fill-opacity="0.92" stroke="#fca5a5"/>
    <text x="106" y="80" text-anchor="middle" class="f bad">6 张相机特征图全部像素</text>
    <text x="106" y="94" text-anchor="middle" class="f muted">几十万个位置全算一遍相似度</text>
  </g>

  <rect x="38" y="294" width="392" height="38" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="234" y="311" text-anchor="middle" class="f bad">复杂度：O(N_BEV × N_cam × H × W)</text>
  <text x="234" y="326" text-anchor="middle" class="f muted">40,000 个 BEV 格 × 6 相机全图 → 显存与车端延迟直接爆炸</text>

  <!-- ==================== 右栏：BEVFormer 投影 + 可变形局部采样 ==================== -->
  <rect x="462" y="54" width="434" height="292" rx="12" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.4"/>
  <rect x="476" y="68" width="194" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="573" y="83" text-anchor="middle" class="f good">✓ BEVFormer 可变形局部采样</text>
  <text x="680" y="83" class="f muted">先算落点，再只采周围 K 点</text>

  <!-- 左侧：BEV 格 + 3D 投影 -->
  <rect x="480" y="168" width="52" height="52" rx="7" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="506" y="192" text-anchor="middle" class="f accent">BEV 格</text>
  <text x="506" y="208" text-anchor="middle" class="mono" font-size="10.5" fill="#6b21d6">Qₚ</text>

  <!-- 单条精准几何投影箭头 -->
  <path d="M 534 194 L 636 194" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arr-p)"/>
  <rect x="544" y="166" width="84" height="20" rx="5" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="586" y="180" text-anchor="middle" class="f accent" font-size="10.5">矩阵 Tᵢ 投影</text>
  <text x="586" y="212" text-anchor="middle" class="f muted">仅命中相机</text>

  <!-- 右侧：命中相机特征图局部放大 -->
  <g transform="translate(646, 112)">
    <rect x="0" y="0" width="232" height="164" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.4"/>
    <text x="12" y="20" class="f accent">命中相机特征图（局部放大）</text>
    <!-- 淡背景网格 -->
    <g stroke="#ede9fe" stroke-width="0.9">
      <line x1="46" y1="28" x2="46" y2="156"/>
      <line x1="92" y1="28" x2="92" y2="156"/>
      <line x1="138" y1="28" x2="138" y2="156"/>
      <line x1="184" y1="28" x2="184" y2="156"/>
      <line x1="10" y1="60" x2="222" y2="60"/>
      <line x1="10" y1="92" x2="222" y2="92"/>
      <line x1="10" y1="124" x2="222" y2="124"/>
    </g>
    <!-- 邻车轮廓剪影 -->
    <rect x="46" y="56" width="76" height="50" rx="8" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="84" y="122" text-anchor="middle" class="f muted" font-size="9.8">目标所在局部区</text>
  </g>

  <!-- 精确投影参考点 (u,v) 位于 (730, 194) + 4 个可学习偏移采样点 -->
  <circle cx="730" cy="194" r="32" fill="#ec4899" fill-opacity="0.07" stroke="#f472b6" stroke-width="1.4" stroke-dasharray="4 3" class="ring-pulse"/>
  <!-- 4 条偏移箭头 (Δu, Δv) -->
  <line x1="730" y1="194" x2="707" y2="176" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arr-pink)"/>
  <line x1="730" y1="194" x2="756" y2="174" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arr-pink)"/>
  <line x1="730" y1="194" x2="710" y2="216" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arr-pink)"/>
  <line x1="730" y1="194" x2="752" y2="214" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arr-pink)"/>

  <!-- 4 个偏移采样点（粉红） -->
  <circle cx="704" cy="174" r="4.5" fill="#ec4899" stroke="#fff" stroke-width="1.5"/>
  <circle cx="759" cy="172" r="4.5" fill="#ec4899" stroke="#fff" stroke-width="1.5"/>
  <circle cx="707" cy="218" r="4.5" fill="#ec4899" stroke="#fff" stroke-width="1.5"/>
  <circle cx="755" cy="216" r="4.5" fill="#ec4899" stroke="#fff" stroke-width="1.5"/>

  <!-- 中心参考点 (u,v)（深紫） -->
  <circle cx="730" cy="194" r="5.5" fill="#6d28d9" stroke="#fff" stroke-width="2"/>

  <!-- 右侧图例标注（稳妥收在框内 x=782..872） -->
  <circle cx="786" cy="190" r="4.2" fill="#6d28d9"/>
  <text x="795" y="194" class="f accent" font-size="9.8">投影点 (u,v)</text>
  <circle cx="786" cy="210" r="4.2" fill="#ec4899"/>
  <text x="795" y="214" class="f pink" font-size="9.8">偏移采样点</text>
  <text x="782" y="232" class="f muted" font-size="9.5">偏移由 Qₚ 预测</text>

  <rect x="476" y="294" width="406" height="38" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="679" y="311" text-anchor="middle" class="f good">复杂度：O(N_BEV × N_hit × N_ref × K)（K 通常仅 4～8 个点）</text>
  <text x="679" y="326" text-anchor="middle" class="f muted">既用几何先验省掉几个数量级算力，又用偏移容忍轻微标定误差</text>

  <!-- 底部总结条 -->
  <rect x="24" y="358" width="872" height="28" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="460" y="376" text-anchor="middle" class="f accent">汇总公式直觉：对所有命中相机 × 所有高度参考点 × 周围 K 个偏移点做加权平均，写回这格的 BEV 向量 Qₚ</text>
</svg>
